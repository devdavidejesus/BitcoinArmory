<svg class="flow flow--wide" viewBox="0 0 560 400" role="img" aria-labelledby="flow-title" aria-describedby="flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="flow-title">How offline signing works</title>
  <desc id="flow-desc">1. An online computer with a watching-only wallet creates an unsigned transaction. 2. The unsigned transaction is carried to an offline computer. 3. The offline computer, which holds the private keys, signs it. 4. The signed transaction is carried back and broadcast through your own Bitcoin Core node.</desc>

  <!-- online computer -->
  <rect class="flow__box" x="20" y="24" width="230" height="118" rx="8"/>
  <text class="flow__title" x="40" y="62">Online computer</text>
  <text class="flow__text" x="40" y="88">Watching-only wallet</text>
  <text class="flow__text" x="40" y="110">Sees balances, cannot spend</text>
  <g class="flow__icon" aria-hidden="true">
    <path d="M212 52 q10 -9 20 0"/>
    <path d="M215.5 57 q6.5 -5.5 13 0"/>
    <circle cx="222" cy="62" r="1.2"/>
  </g>

  <!-- your node -->
  <line class="flow__line" x1="70" y1="142" x2="70" y2="300"/>
  <rect class="flow__box flow__box--node" x="20" y="300" width="230" height="86" rx="8"/>
  <text class="flow__title" x="40" y="335">Your Bitcoin Core node</text>
  <text class="flow__text" x="40" y="361">Talks to the Bitcoin network</text>

  <!-- offline computer -->
  <rect class="flow__box flow__box--offline" x="310" y="160" width="230" height="118" rx="8"/>
  <text class="flow__title" x="330" y="198">Offline computer</text>
  <text class="flow__text" x="330" y="224">Holds the private keys</text>
  <text class="flow__text" x="330" y="246">Never connects to the internet</text>
  <g class="flow__icon flow__icon--key" aria-hidden="true">
    <circle cx="500" cy="186" r="5"/>
    <path d="M505 186 h17 M517 186 v5 M522 186 v4"/>
  </g>

  <!-- unsigned transaction: online to offline -->
  <path class="flow__path flow__path--out" pathLength="1" d="M250 64 C 340 64, 425 92, 425 150"/>
  <polygon class="flow__arrow flow__arrow--out" points="418,148 432,148 425,159"/>
  <text class="flow__label flow__label--out" x="276" y="50">Unsigned transaction</text>

  <!-- signed transaction: offline back to online -->
  <path class="flow__path flow__path--back" pathLength="1" d="M310 252 C 240 252, 185 214, 185 154"/>
  <polygon class="flow__arrow flow__arrow--back" points="178,156 192,156 185,145"/>
  <text class="flow__label flow__label--signed" x="212" y="174">Signed</text>
  <text class="flow__label flow__label--signed" x="212" y="192">transaction</text>

  <!-- the four steps, numbered like the list below the hero -->
  <g class="flow__step flow__step--1" aria-hidden="true"><circle cx="20" cy="24" r="13"/><text x="20" y="28.5">1</text></g>
  <g class="flow__step flow__step--2" aria-hidden="true"><circle cx="371" cy="86" r="13"/><text x="371" y="90.5">2</text></g>
  <g class="flow__step flow__step--3" aria-hidden="true"><circle cx="310" cy="160" r="13"/><text x="310" y="164.5">3</text></g>
  <g class="flow__step flow__step--4" aria-hidden="true"><circle cx="221" cy="226" r="13"/><text x="221" y="230.5">4</text></g>
</svg>
<svg class="flow flow--tall" viewBox="0 0 360 520" role="img" aria-labelledby="flow-title-m" aria-describedby="flow-desc-m" xmlns="http://www.w3.org/2000/svg">
  <title id="flow-title-m">How offline signing works</title>
  <desc id="flow-desc-m">1. An online computer with a watching-only wallet creates an unsigned transaction. 2. The unsigned transaction is carried to an offline computer. 3. The offline computer, which holds the private keys, signs it. 4. The signed transaction is carried back and broadcast through your own Bitcoin Core node.</desc>

  <!-- your node -->
  <rect class="flow__box flow__box--node" x="20" y="20" width="320" height="84" rx="8"/>
  <text class="flow__title" x="40" y="55">Your Bitcoin Core node</text>
  <text class="flow__text" x="40" y="81">Talks to the Bitcoin network</text>
  <line class="flow__line" x1="180" y1="104" x2="180" y2="170"/>

  <!-- online computer -->
  <rect class="flow__box" x="20" y="170" width="320" height="100" rx="8"/>
  <text class="flow__title" x="40" y="206">Online computer</text>
  <text class="flow__text" x="40" y="232">Watching-only wallet</text>
  <text class="flow__text" x="40" y="254">Sees balances, cannot spend</text>
  <g class="flow__icon" aria-hidden="true">
    <path d="M300 198 q10 -9 20 0"/>
    <path d="M303.5 203 q6.5 -5.5 13 0"/>
    <circle cx="310" cy="208" r="1.2"/>
  </g>

  <!-- offline computer -->
  <rect class="flow__box flow__box--offline" x="20" y="396" width="320" height="104" rx="8"/>
  <text class="flow__title" x="40" y="432">Offline computer</text>
  <text class="flow__text" x="40" y="458">Holds the private keys</text>
  <text class="flow__text" x="40" y="480">Never connects to the internet</text>
  <g class="flow__icon flow__icon--key" aria-hidden="true">
    <circle cx="298" cy="424" r="5"/>
    <path d="M303 424 h17 M315 424 v5 M320 424 v4"/>
  </g>

  <!-- unsigned transaction: down -->
  <path class="flow__path flow__path--out" pathLength="1" d="M270 270 L 270 384"/>
  <polygon class="flow__arrow flow__arrow--out" points="263,382 277,382 270,394"/>
  <text class="flow__label flow__label--out" x="252" y="316" text-anchor="end">Unsigned</text>
  <text class="flow__label flow__label--out" x="252" y="334" text-anchor="end">transaction</text>

  <!-- signed transaction: up -->
  <path class="flow__path flow__path--back" pathLength="1" d="M90 396 L 90 282"/>
  <polygon class="flow__arrow flow__arrow--back" points="83,284 97,284 90,272"/>
  <text class="flow__label flow__label--signed" x="108" y="352">Signed</text>
  <text class="flow__label flow__label--signed" x="108" y="370">transaction</text>

  <g class="flow__step flow__step--1" aria-hidden="true"><circle cx="20" cy="170" r="13"/><text x="20" y="174.5">1</text></g>
  <g class="flow__step flow__step--2" aria-hidden="true"><circle cx="270" cy="296" r="13"/><text x="270" y="300.5">2</text></g>
  <g class="flow__step flow__step--3" aria-hidden="true"><circle cx="20" cy="396" r="13"/><text x="20" y="400.5">3</text></g>
  <g class="flow__step flow__step--4" aria-hidden="true"><circle cx="90" cy="310" r="13"/><text x="90" y="314.5">4</text></g>
</svg>
