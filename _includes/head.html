<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="{{ site.name }} home">
      <img src="{{ site.avatar | relative_url }}" alt="" width="36" height="36" />
      <span>{{ site.name }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul>
        <li{% if page.id == 'releases' %} class="active"{% endif %}><a href="{{ '/releases/' | relative_url }}">Releases</a></li>
        <li class="has-sub{% if page.id == 'building' or page.id == 'verify' or page.id == 'pathing' or page.id == 'faq' %} active{% endif %}">
          <a href="{{ '/docs/verify' | relative_url }}" aria-haspopup="true">Documentation</a>
          <ul>
            <li{% if page.id == 'verify' %} class="active"{% endif %}><a href="{{ '/docs/verify' | relative_url }}">Verify binaries</a></li>
            <li{% if page.id == 'building' %} class="active"{% endif %}><a href="{{ '/docs/building/' | relative_url }}">Building from source</a></li>
            <li{% if page.id == 'pathing' %} class="active"{% endif %}><a href="{{ '/docs/pathing' | relative_url }}">Pathing</a></li>
            <li{% if page.id == 'faq' %} class="active"{% endif %}><a href="{{ '/docs/faq' | relative_url }}">FAQ</a></li>
          </ul>
        </li>
        <li class="has-sub{% if page.id == 'contribute' or page.id == 'armory-todo' or page.id == 'website-todo' %} active{% endif %}">
          <a href="{{ '/contribute/' | relative_url }}" aria-haspopup="true">Contribute</a>
          <ul>
            <li{% if page.id == 'contribute' %} class="active"{% endif %}><a href="{{ '/contribute/' | relative_url }}">How to contribute</a></li>
            <li{% if page.id == 'armory-todo' %} class="active"{% endif %}><a href="{{ '/contribute/armory-todo/' | relative_url }}">Armory to-do list</a></li>
            <li{% if page.id == 'website-todo' %} class="active"{% endif %}><a href="{{ '/contribute/website-todo/' | relative_url }}">Website to-do list</a></li>
          </ul>
        </li>
        <li{% if page.id == 'contact' %} class="active"{% endif %}><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
        <li{% if page.id == 'about' %} class="active"{% endif %}><a href="{{ '/about/' | relative_url }}">About</a></li>
      </ul>
    </nav>
  </div>
</header>
