name: PR 794 tests build check, Armory::Threading namespace (--enable-tests)

# Builds the unit tests with --enable-tests on PR #794 plus the commit that
# moves AtomicSharedPtr into Armory::Threading (branch pr794-namespace, tree
# ea814bce), and on its merge with goatpig/rc2_fixes 4aacbea (tree b346d3aa),
# with gcc and clang on Ubuntu 24.04 and Apple clang on macOS 15.
# A job passes when WalletTests and BridgeTests build and the only failing
# make target, if any, is gtest/ContainerTests.

on:
  push:
    branches: [ci/pr794-ns-build]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBBTC_COMMIT: 07933995eb5010a016c75fb703a66023116013a3
  LWS_TAG: v4.5.8
  LWS_COMMIT: fbb0baf6af9c4324f0f1591734c78b0089b599d4
  PR_TREE: ea814bce11fd1c1abc1bf44aa6536dbb9f41b046
  RC2_COMMIT: 4aacbeac6c7601b77987bdd324dae6126595b84a
  MERGED_TREE: b346d3aa63a0240d6fc1648bf763f887d0bc3a48

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        cc: [gcc, clang]
        variant: [pr-head, merged-rc2_fixes]
        exclude:
          - { os: macos-15, cc: gcc }
    steps:
      - name: Checkout PR 794 + the namespace commit
        uses: actions/checkout@v4
        with:
          ref: pr794-namespace
          path: BitcoinArmory
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the exact tree (and build the merge for merged-rc2_fixes)
        shell: bash
        run: |
          set -euo pipefail
          cd BitcoinArmory
          test "$(git rev-parse 'HEAD^{tree}')" = "${PR_TREE}"
          echo "PR head: $(git rev-parse HEAD) | tree ${PR_TREE}"
          if [ "${{ matrix.variant }}" = "merged-rc2_fixes" ]; then
            git fetch --quiet https://github.com/goatpig/BitcoinArmory "${RC2_COMMIT}"
            test "$(git rev-parse FETCH_HEAD)" = "${RC2_COMMIT}"
            t="$(git merge-tree --write-tree "${RC2_COMMIT}" HEAD)"
            test "${t}" = "${MERGED_TREE}"
            git read-tree -u --reset "${t}"
            test "$(git write-tree)" = "${MERGED_TREE}"
            echo "merged with rc2_fixes ${RC2_COMMIT}: tree ${t}"
          fi

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            capnproto libcapnp-dev liblmdb-dev cmake libgtest-dev clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config capnp lmdb cmake googletest

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cc }}" = "clang" ]; then clang++ --version | head -1; else g++ --version | head -1; fi

      - name: Build libbtc and libwebsockets (pinned)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libbtc/libbtc
          git -C libbtc checkout --quiet "${LIBBTC_COMMIT}"
          test "$(git -C libbtc rev-parse HEAD)" = "${LIBBTC_COMMIT}"
          (cd libbtc && sh autogen.sh && CFLAGS="-fPIC -g" ./configure --disable-wallet \
            --disable-tools --disable-net --disable-shared && make -j"$(getconf _NPROCESSORS_ONLN)")
          git clone --quiet --branch "${LWS_TAG}" --depth 1 https://github.com/warmcat/libwebsockets
          test "$(git -C libwebsockets rev-parse HEAD)" = "${LWS_COMMIT}"
          cmake -S libwebsockets -B libwebsockets/build -DLWS_WITH_SSL=OFF -DLWS_WITHOUT_TESTAPPS=ON
          cmake --build libwebsockets/build -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Configure with --enable-tests
        shell: bash
        run: |
          set -euo pipefail
          cd BitcoinArmory
          sh autogen.sh
          mkdir build && cd build
          extra=()
          if [ "${{ matrix.cc }}" = "clang" ]; then extra+=(CC=clang CXX=clang++); fi
          if [ "${RUNNER_OS}" = "macOS" ]; then
            p="$(brew --prefix)"
            extra+=(CPPFLAGS="-I${p}/include" LDFLAGS="-L${p}/lib")
          fi
          ../configure --enable-tests \
            --with-own-libbtc="${GITHUB_WORKSPACE}/libbtc" \
            --with-own-lws="${GITHUB_WORKSPACE}/libwebsockets/build" \
            "${extra[@]}"

      - name: Build (make -k) and check the test binaries
        shell: bash
        run: |
          set +e
          cd BitcoinArmory/build
          make -k -j"$(getconf _NPROCESSORS_ONLN)" > make.log 2>&1
          rc=$?
          failed="$(grep -oE '\*\*\* \[[^]]*\]' make.log | sed -E 's/^\*\*\* \[//; s/\]$//; s/^.*: //' | grep -vE '^all(-recursive|-am)?$' | sort -u | tr '\n' ' ')"
          unexpected="$(echo "${failed}" | tr ' ' '\n' | grep -vE '^(gtest/ContainerTests)?$' | tr '\n' ' ')"
          wt=NOT; [ -x cppForSwig/gtest/WalletTests ] && wt=built
          bt=NOT; [ -x cppForSwig/gtest/BridgeTests ] && bt=built
          line="${{ matrix.os }} | ${{ matrix.cc }} | ${{ matrix.variant }} | make rc=${rc} | failed targets: ${failed:-none} | WalletTests ${wt} | BridgeTests ${bt}"
          echo "${line}"
          echo "${line}" >> "${GITHUB_STEP_SUMMARY}"
          echo "---- first errors ----"
          grep -m 10 -E 'error:|undefined reference' make.log || echo "(none)"
          if [ "${wt}" = built ] && [ "${bt}" = built ] && [ -z "${unexpected// /}" ]; then
            echo "OK: WalletTests and BridgeTests built; unexpected failing targets: none"
            exit 0
          fi
          echo "::error::WalletTests=${wt} BridgeTests=${bt} unexpected failing targets: ${unexpected:-none}"
          exit 1

      - name: Upload make log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.variant }}
          path: BitcoinArmory/build/make.log
          if-no-files-found: warn
