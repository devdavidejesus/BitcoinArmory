name: Armory unit tests (WalletTests, BridgeTests)

# Builds goatpig/BitcoinArmory rc2_fixes (5554ef1f) with --enable-tests and runs
# WalletTests and BridgeTests, with and without the changes from PR #794, using
# GCC and clang on Ubuntu and Apple clang on macOS. Every job pins the exact
# source tree it tests (git tree hash), not just the branch name.

on:
  push:
    branches: [ci/unit-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc,   label: rc2_fixes,                ref: 5554ef1f2efe500392525ca82fb94188006bff1e, tree: d8b0ef52f0e20ff0681af704ad603aede3d1325a, expect: pass }
          - { os: ubuntu-24.04, cc: gcc,   label: rc2_fixes+794+gtestfix,   ref: tests/794-with-wallettests-fix,           tree: 5cc2891cff4794bf5587fe7816739c5dca4953f8, expect: pass }
          - { os: ubuntu-24.04, cc: clang, label: rc2_fixes,                ref: 5554ef1f2efe500392525ca82fb94188006bff1e, tree: d8b0ef52f0e20ff0681af704ad603aede3d1325a, expect: wallettests-build-fails }
          - { os: ubuntu-24.04, cc: clang, label: rc2_fixes+gtestfix,       ref: fix-wallettests-clang,                    tree: 75c80a708e3a173de00bea51ab53484fc789aa34, expect: pass }
          - { os: ubuntu-24.04, cc: clang, label: rc2_fixes+794+gtestfix,   ref: tests/794-with-wallettests-fix,           tree: 5cc2891cff4794bf5587fe7816739c5dca4953f8, expect: pass }
          - { os: macos-15,     cc: clang, label: rc2_fixes+794+gtestfix,   ref: tests/794-with-wallettests-fix,           tree: 5cc2891cff4794bf5587fe7816739c5dca4953f8, expect: pass }
    env:
      LIBBTC_COMMIT: 07933995eb5010a016c75fb703a66023116013a3
      LWS_TAG: v4.5.8
      LWS_COMMIT: fbb0baf6af9c4324f0f1591734c78b0089b599d4
    steps:
      - name: Checkout Armory (${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: BitcoinArmory
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm the exact source tree
        shell: bash
        run: |
          set -euo pipefail
          got="$(git -C BitcoinArmory rev-parse 'HEAD^{tree}')"
          echo "commit: $(git -C BitcoinArmory rev-parse HEAD)"
          echo "tree:   ${got}"
          test "${got}" = "${{ matrix.tree }}"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            capnproto libcapnp-dev liblmdb-dev cmake libgtest-dev clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config capnp lmdb cmake googletest

      - name: Toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cc }}" = "clang" ]; then clang++ --version | head -1; else g++ --version | head -1; fi
          capnp --version
          echo "cpus: $(getconf _NPROCESSORS_ONLN)"

      - name: Build libbtc (pinned commit)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/libbtc/libbtc
          cd libbtc
          git checkout --quiet "${LIBBTC_COMMIT}"
          test "$(git rev-parse HEAD)" = "${LIBBTC_COMMIT}"
          sh autogen.sh
          CFLAGS="-fPIC -g" ./configure --disable-wallet --disable-tools \
            --disable-net --disable-shared
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Build libwebsockets (pinned tag, no TLS)
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --branch "${LWS_TAG}" --depth 1 \
            https://github.com/warmcat/libwebsockets
          test "$(git -C libwebsockets rev-parse HEAD)" = "${LWS_COMMIT}"
          cmake -S libwebsockets -B libwebsockets/build \
            -DLWS_WITH_SSL=OFF -DLWS_WITHOUT_TESTAPPS=ON
          cmake --build libwebsockets/build -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Configure Armory with --enable-tests
        shell: bash
        run: |
          set -euo pipefail
          cd BitcoinArmory
          sh autogen.sh
          mkdir build
          cd build
          extra=()
          if [ "${{ matrix.cc }}" = "clang" ]; then
            extra+=(CC=clang CXX=clang++)
          fi
          if [ "${RUNNER_OS}" = "macOS" ]; then
            p="$(brew --prefix)"
            extra+=(CPPFLAGS="-I${p}/include" LDFLAGS="-L${p}/lib")
          fi
          ../configure --enable-tests \
            --with-own-libbtc="${GITHUB_WORKSPACE}/libbtc" \
            --with-own-lws="${GITHUB_WORKSPACE}/libwebsockets/build" \
            "${extra[@]}"

      - name: Build (make -k, so one failing target does not hide the others)
        shell: bash
        run: |
          set -uo pipefail
          cd BitcoinArmory/build
          if make -k -j"$(getconf _NPROCESSORS_ONLN)" > make.log 2>&1; then rc=0; else rc=$?; fi
          echo "${rc}" > make.rc
          echo "make rc=${rc}"
          echo "---- errors (first 20) ----"
          grep -m 20 'error:' make.log || echo "(none)"
          echo "---- test binaries built ----"
          for t in WalletTests BridgeTests; do
            if [ -x "cppForSwig/gtest/${t}" ]; then echo "${t}: built"; else echo "${t}: NOT built"; fi
          done

      - name: Run WalletTests
        if: always()
        timeout-minutes: 120
        shell: bash
        run: |
          set -uo pipefail
          cd BitcoinArmory/build/cppForSwig/gtest
          if [ ! -x ./WalletTests ]; then echo "not built" > WalletTests.rc; echo "WalletTests not built"; exit 0; fi
          if ./WalletTests --gtest_output=xml:WalletTests.xml > WalletTests.log 2>&1; then rc=0; else rc=$?; fi
          echo "${rc}" > WalletTests.rc
          tail -n 30 WalletTests.log

      - name: Run BridgeTests
        if: always()
        timeout-minutes: 120
        shell: bash
        run: |
          set -uo pipefail
          cd BitcoinArmory/build/cppForSwig/gtest
          if [ ! -x ./BridgeTests ]; then echo "not built" > BridgeTests.rc; echo "BridgeTests not built"; exit 0; fi
          if ./BridgeTests --gtest_output=xml:BridgeTests.xml > BridgeTests.log 2>&1; then rc=0; else rc=$?; fi
          echo "${rc}" > BridgeTests.rc
          tail -n 30 BridgeTests.log

      - name: Summary and expected outcome (${{ matrix.expect }})
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          b=BitcoinArmory/build
          g="${b}/cppForSwig/gtest"
          mrc="$(cat "${b}/make.rc" 2>/dev/null || echo missing)"
          amb="$(grep -c "use of overloaded operator '==' is ambiguous" "${b}/make.log" 2>/dev/null || true)"
          res() {
            local t="$1" rc passed failed
            rc="$(cat "${g}/${t}.rc" 2>/dev/null || echo missing)"
            passed="$(grep -oE '\[  PASSED  \] [0-9]+ test' "${g}/${t}.log" 2>/dev/null | grep -oE '[0-9]+' || echo 0)"
            failed="$(grep -oE '\[  FAILED  \] [0-9]+ test' "${g}/${t}.log" 2>/dev/null | grep -oE '[0-9]+' || echo 0)"
            echo "${t}: rc=${rc} passed=${passed} failed=${failed}"
            grep -E '^\[  FAILED  \] [A-Za-z_]' "${g}/${t}.log" 2>/dev/null | sed 's/^/    /' || true
          }
          w="$(res WalletTests)"; br="$(res BridgeTests)"
          line="${{ matrix.os }} | ${{ matrix.cc }} | ${{ matrix.label }} | make rc=${mrc} (ambiguous operator== errors: ${amb}) | $(echo "${w}" | head -1) | $(echo "${br}" | head -1)"
          echo "${line}"; echo "${w}"; echo "${br}"
          {
            echo "${line}"
            echo '```'; echo "${w}"; echo "${br}"; echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          wrc="$(cat "${g}/WalletTests.rc" 2>/dev/null || echo missing)"
          brc="$(cat "${g}/BridgeTests.rc" 2>/dev/null || echo missing)"
          if [ "${{ matrix.expect }}" = "pass" ]; then
            if [ "${mrc}" = 0 ] && [ "${wrc}" = 0 ] && [ "${brc}" = 0 ]; then
              echo "OK: built, and both test suites passed"
            else
              echo "::error::expected a clean build and both test suites passing"; exit 1
            fi
          else
            if [ "${wrc}" = "not built" ] && [ "${amb}" -gt 0 ] && [ "${brc}" = 0 ]; then
              echo "OK: WalletTests failed to build on the ambiguous operator== (as expected), BridgeTests passed"
            else
              echo "::error::expected WalletTests to fail to build on the ambiguous operator== and BridgeTests to pass"; exit 1
            fi
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.cc }}-${{ strategy.job-index }}
          path: |
            BitcoinArmory/build/make.log
            BitcoinArmory/build/cppForSwig/gtest/*.log
            BitcoinArmory/build/cppForSwig/gtest/*.xml
          if-no-files-found: warn
