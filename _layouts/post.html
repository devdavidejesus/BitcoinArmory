---
layout: default
---

<article class="post-full">
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>

  {% if page.image and page.show_image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}" />{% endif %}

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
</article>
